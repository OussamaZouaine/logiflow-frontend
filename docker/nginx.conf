# Sert l'application Angular (SPA). Le TLS et le routage /api sont assurés par le reverse proxy
# placé devant (Caddy, voir logiflow-infra) : ce conteneur n'écoute qu'en HTTP interne.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;

  # Fichiers générés avec une empreinte dans leur nom : cache long et immuable.
  location ~* \.(?:js|css|woff2?|png|jpe?g|gif|svg|ico)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Configuration de déploiement et page d'entrée : jamais en cache.
  location = /config.js {
    add_header Cache-Control "no-store";
    add_header X-Content-Type-Options "nosniff" always;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
  }

  # Sonde de santé du conteneur.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Routage côté client : toute URL inconnue renvoie l'application.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
