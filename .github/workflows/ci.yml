name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Vérifier le lint et le formatage (Ultracite)
        run: pnpm check

      - name: Exécuter les tests unitaires (Vitest)
        run: pnpm exec ng test --watch=false

      - name: Construire (production)
        run: pnpm build

      - name: Publier le build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: ignore
