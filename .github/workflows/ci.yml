name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Installer
        uses: ./.github/actions/setup

      - name: Vérifier le lint et le formatage (Ultracite)
        run: pnpm check

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Installer
        uses: ./.github/actions/setup

      - name: Exécuter les tests unitaires (Vitest)
        run: pnpm exec ng test --watch=false

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Installer
        uses: ./.github/actions/setup

      - name: Construire (production)
        run: pnpm build

      - name: Publier le build
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  docker:
    name: Image Docker
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Se connecter à GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR exige un nom d'image en minuscules (le propriétaire du dépôt en contient).
      - name: Nom de l'image
        id: image
        run: echo "nom=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/logiflow-frontend" >> "$GITHUB_OUTPUT"

      # Publiée uniquement sur push vers main : consommée par logiflow-infra. Une même image sert
      # tous les environnements (URL Keycloak lues au démarrage, voir docker/40-logiflow-config.sh).
      - name: Construire (et publier) l'image du frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.image.outputs.nom }}:latest
            ${{ steps.image.outputs.nom }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ci:
    name: CI
    needs: [lint, test, build, docker]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Vérifier que tous les jobs ont réussi
        run: |
          test "${{ needs.lint.result }}" = success
          test "${{ needs.test.result }}" = success
          test "${{ needs.build.result }}" = success
          test "${{ needs.docker.result }}" = success
