<div class="inner-page fiche-page fiche-page--wide">
  <app-fiche-header icon="lucideMapPin">
    @if (site.isLoading()) {
    <p class="fiche-load-hint" role="status">Chargement…</p>
    } @else if (site.error()) {
    <app-fiche-error
      (retry)="site.reload()"
      [message]="loadError()"
    />
    } @else if (site.hasValue()) {
    <app-fiche-title-row [mono]="true" [title]="site.value().code">
      <app-statut-chip
        [icon]="actifIcon(site.value().actif)"
        [label]="actifLabel(site.value().actif)"
        [tone]="actifTone(site.value().actif)"
      />
    </app-fiche-title-row>
    <p class="fiche-meta">{{ site.value().libelle }}</p>
    }
  </app-fiche-header>

  @if (site.hasValue()) {
  <form (submit)="onSubmit($event)" class="form-page" novalidate>
    <app-form-validation-summary
      [show]="editForm().touched() && editForm().invalid()"
    />

    <div class="form-page__layout form-page__layout--split">
      <app-form-section
        description="Le code n'est pas modifiable."
        title="Fiche"
      >
        <app-form-field
          [error]="
            showFieldError(editForm.libelle())
              ? firstFieldError(editForm.libelle().errors())
              : null
          "
          inputId="libelle"
          label="Libellé"
        >
          <input
            [attr.aria-invalid]="showFieldError(editForm.libelle()) || null"
            [class]="fieldClasses(editForm.libelle())"
            [formField]="editForm.libelle"
            id="libelle"
            type="text"
          />
        </app-form-field>

        <app-form-field inputId="adresse" label="Adresse">
          <input
            [formField]="editForm.adresse"
            [class]="fieldClasses(editForm.adresse())"
            id="adresse"
            type="text"
          />
        </app-form-field>

        <app-fiche-checkbox-row
          (checkedChange)="onPoidsLourdChange($event)"
          [checked]="draft().interditPoidsLourd"
          hint="Exclut ce site des itinéraires poids lourds."
          label="Interdit aux poids lourds"
        />
      </app-form-section>

      <app-form-section
        description="Cliquez sur la carte ou déplacez le repère. Les coordonnées se mettent à jour automatiquement."
        title="Localisation"
      >
        <app-site-localisation-map
          (coordinatesChange)="onLocalisationChange($event)"
          [latitude]="draft().latitude"
          [longitude]="draft().longitude"
          [showHeader]="false"
        />

        <div class="form-page__coords fiche-inset">
          <app-form-field
            [error]="
              showFieldError(editForm.latitude())
                ? firstFieldError(editForm.latitude().errors())
                : null
            "
            inputId="latitude"
            label="Latitude"
          >
            <input
              [attr.aria-invalid]="showFieldError(editForm.latitude()) || null"
              [class]="fieldClasses(editForm.latitude())"
              [formField]="editForm.latitude"
              id="latitude"
              step="0.0001"
              type="number"
            />
          </app-form-field>

          <app-form-field
            [error]="
              showFieldError(editForm.longitude())
                ? firstFieldError(editForm.longitude().errors())
                : null
            "
            inputId="longitude"
            label="Longitude"
          >
            <input
              [attr.aria-invalid]="showFieldError(editForm.longitude()) || null"
              [class]="fieldClasses(editForm.longitude())"
              [formField]="editForm.longitude"
              id="longitude"
              step="0.0001"
              type="number"
            />
          </app-form-field>
        </div>
      </app-form-section>
    </div>

    @if (formError()) {
    <div class="alert-panel" role="alert">{{ formError() }}</div>
    }

    <app-form-actions [inline]="true">
      <button class="btn-toolbar pressable" type="submit">
        <ng-icon aria-hidden="true" class="btn-toolbar__icon" name="lucideCheck" />
        <span>Enregistrer</span>
      </button>
    </app-form-actions>
  </form>

  @if (site.value().actif) {
  <app-fiche-danger-zone
    description="Le site reste en base, marqué inactif. Pas de suppression physique."
    title="Désactivation"
  >
    @if (deactivateError()) {
    <div class="alert-panel" role="alert">{{ deactivateError() }}</div>
    }
    <button
      (click)="desactiver()"
      class="btn-danger-outline pressable w-fit"
      type="button"
    >
      <ng-icon
        aria-hidden="true"
        class="size-[0.9375rem] shrink-0 opacity-90"
        name="lucideCircleOff"
      />
      <span>Désactiver</span>
    </button>
  </app-fiche-danger-zone>
  } }
</div>
