<app-form-page-header
  description="Le login ne se modifie plus ensuite. Compte créé actif."
  listLabel="Utilisateurs"
  listLink="/utilisateurs"
  title="Nouvel utilisateur"
/>

<form (submit)="onSubmit($event)" class="form-page" novalidate>
  <app-form-validation-summary
    [show]="createForm().touched() && createForm().invalid()"
  />

  <app-form-section title="Compte">
    <app-form-field
      [error]="
        showFieldError(createForm.login())
          ? firstFieldError(createForm.login().errors())
          : null
      "
      inputId="login"
      label="Login"
    >
      <input
        [attr.aria-invalid]="showFieldError(createForm.login()) || null"
        [class]="fieldClasses(createForm.login())"
        [formField]="createForm.login"
        autocomplete="off"
        id="login"
        placeholder="marie.dupont"
        type="text"
      />
    </app-form-field>

    <app-form-field
      [error]="
        showFieldError(createForm.email())
          ? firstFieldError(createForm.email().errors())
          : null
      "
      inputId="email"
      label="Email"
    >
      <input
        [attr.aria-invalid]="showFieldError(createForm.email()) || null"
        [class]="fieldClasses(createForm.email())"
        [formField]="createForm.email"
        autocomplete="off"
        id="email"
        placeholder="marie.dupont@logiflow.tms"
        type="email"
      />
    </app-form-field>

    <fieldset class="fiche-inset flex flex-col gap-2 p-4">
      <legend class="px-1 text-xs font-medium text-muted">Rôles</legend>
      @for (role of roles; track role) {
      <label class="flex items-center gap-2 text-sm text-ink">
        <input
          (change)="toggleRole(role, $event)"
          [checked]="draft().roles.includes(role)"
          class="size-4 accent-pine"
          type="checkbox"
        />
        {{ roleLabel(role) }}
      </label>
      }
    </fieldset>
    @if (rolesTouched() && draft().roles.length === 0) {
    <p class="text-xs text-brake" role="alert">
      Au moins un rôle est obligatoire.
    </p>
    }
  </app-form-section>

  @if (formError()) {
  <div class="alert-panel" role="alert">{{ formError() }}</div>
  }

  <app-form-actions>
    <button class="btn-primary pressable min-h-11 px-5" type="submit">
      Enregistrer
    </button>
    <a class="btn-outline pressable min-h-11 px-5" routerLink="/utilisateurs">
      Annuler
    </a>
  </app-form-actions>
</form>
