<div class="flex min-h-[70dvh] flex-col justify-center">
  <p class="text-[0.7rem] font-medium tracking-[0.22em] text-pine uppercase">
    Accès
  </p>
  <p
    class="font-display mt-3 text-7xl leading-none font-medium tracking-tight text-ink sm:text-8xl"
  >
    403
  </p>
  <h1 class="font-display mt-4 text-3xl font-medium tracking-tight text-ink">
    Accès refusé
  </h1>
  @if (hasSession()) {
  <p class="mt-4 max-w-md text-pretty text-sm leading-relaxed text-muted">
    Le rôle
    <span class="text-ink">{{ roleName() }}</span>
    @if (login()) { (<span class="font-mono text-ink">{{ login() }}</span>) } ne
    permet pas d'ouvrir cette page.
  </p>
  }
  <p class="mt-3 max-w-md text-pretty text-sm text-muted">
    Retourne au tableau de bord, ou déconnecte-toi pour entrer avec un autre
    compte.
  </p>
  <div class="mt-8 flex flex-wrap gap-3">
    <a
      class="pressable pressable-border border border-line px-4 py-2 text-sm font-medium text-ink"
      routerLink="/"
    >
      Tableau de bord
    </a>
    <button
      (click)="signOut()"
      class="pressable pressable-border border border-line px-4 py-2 text-sm font-medium text-ink"
      type="button"
    >
      Déconnexion
    </button>
  </div>
</div>
