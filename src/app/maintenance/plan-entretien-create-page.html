<div class="inner-page fiche-page--wide">
  <app-form-page-header
    description="Périodicité kilométrique et/ou calendaire (au moins l'une des deux). Le véhicule doit déjà exister."
    icon="lucideWrench"
    title="Nouveau plan d'entretien"
  />

  <app-maintenance-tabs />

@if (vehicules.isLoading()) {
<p class="text-sm text-muted" role="status">Chargement des véhicules…</p>
} @else if (lookupsError()) {
<div class="alert-panel" role="alert">
  <p>{{ lookupsError() }}</p>
</div>
} @else if (vehicules.hasValue()) {
<form (submit)="onSubmit($event)" class="form-page" novalidate>
  <app-form-validation-summary
    [show]="createForm().touched() && createForm().invalid()"
  />

  <app-form-section title="Plan">
    <app-form-field
      [error]="
        showFieldError(createForm.vehiculeId())
          ? firstFieldError(createForm.vehiculeId().errors())
          : null
      "
      inputId="vehiculeId"
      label="Véhicule *"
    >
      <app-field-select
        [formField]="createForm.vehiculeId"
        [invalid]="showFieldError(createForm.vehiculeId())"
        [options]="vehiculeSelectOptions()"
        inputId="vehiculeId"
        placeholder="Choisir un véhicule…"
      />
    </app-form-field>

    <app-form-field
      [error]="
        showFieldError(createForm.libelle())
          ? firstFieldError(createForm.libelle().errors())
          : null
      "
      inputId="libelle"
      label="Libellé *"
    >
      <input
        [formField]="createForm.libelle"
        [class]="fieldClasses(createForm.libelle())"
        id="libelle"
        type="text"
      />
    </app-form-field>

    <div class="form-page__coords">
      <app-form-field
        [error]="
          showFieldError(createForm.periodiciteKm())
            ? firstFieldError(createForm.periodiciteKm().errors())
            : null
        "
        inputId="periodiciteKm"
        label="Périodicité (km)"
      >
        <input
          [formField]="createForm.periodiciteKm"
          [class]="fieldClasses(createForm.periodiciteKm())"
          id="periodiciteKm"
          placeholder="Optionnel"
          step="1"
          type="number"
        />
      </app-form-field>

      <app-form-field
        [error]="
          showFieldError(createForm.periodiciteMois())
            ? firstFieldError(createForm.periodiciteMois().errors())
            : null
        "
        inputId="periodiciteMois"
        label="Périodicité (mois)"
      >
        <input
          [formField]="createForm.periodiciteMois"
          [class]="fieldClasses(createForm.periodiciteMois())"
          id="periodiciteMois"
          placeholder="Optionnel"
          step="1"
          type="number"
        />
      </app-form-field>
    </div>

    <div class="form-page__coords">
      <app-form-field
        [error]="
          showFieldError(createForm.seuilAlerteKm())
            ? firstFieldError(createForm.seuilAlerteKm().errors())
            : null
        "
        inputId="seuilAlerteKm"
        label="Seuil alerte (km)"
      >
        <input
          [formField]="createForm.seuilAlerteKm"
          [class]="fieldClasses(createForm.seuilAlerteKm())"
          id="seuilAlerteKm"
          step="1"
          type="number"
        />
      </app-form-field>

      <app-form-field
        [error]="
          showFieldError(createForm.dureeEstimeeMin())
            ? firstFieldError(createForm.dureeEstimeeMin().errors())
            : null
        "
        inputId="dureeEstimeeMin"
        label="Durée estimée (min)"
      >
        <input
          [formField]="createForm.dureeEstimeeMin"
          [class]="fieldClasses(createForm.dureeEstimeeMin())"
          id="dureeEstimeeMin"
          step="1"
          type="number"
        />
      </app-form-field>
    </div>
  </app-form-section>

  @if (formError()) {
  <div class="alert-panel" role="alert">{{ formError() }}</div>
  }

    <app-form-actions [inline]="true">
      <button class="btn-toolbar pressable" type="submit">
        <ng-icon aria-hidden="true" class="btn-toolbar__icon" name="lucideCheck" />
        <span>Enregistrer</span>
      </button>
      <a class="btn-outline pressable" routerLink="/maintenance/plans">Annuler</a>
    </app-form-actions>
  </form>
  }
</div>
