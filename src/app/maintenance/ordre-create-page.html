<app-form-page-header
  description="Créé au statut Planifié. Le véhicule doit déjà exister."
  listLabel="Maintenance"
  listLink="/maintenance"
  title="Nouvel ordre de travail"
/>

@if (vehicules.isLoading()) {
<p class="text-sm text-muted" role="status">Chargement des véhicules…</p>
} @else if (lookupsError()) {
<div class="alert-panel" role="alert">
  <p>{{ lookupsError() }}</p>
</div>
} @else if (vehicules.hasValue()) {
<form (submit)="onSubmit($event)" class="form-page" novalidate>
  <app-form-validation-summary
    [show]="createForm().touched() && createForm().invalid()"
  />

  <app-form-section title="Intervention">
    <app-form-field
      [error]="
        showFieldError(createForm.vehiculeId())
          ? firstFieldError(createForm.vehiculeId().errors())
          : null
      "
      inputId="vehiculeId"
      label="Véhicule"
    >
      <app-field-select
        [formField]="createForm.vehiculeId"
        [invalid]="showFieldError(createForm.vehiculeId())"
        [options]="vehiculeSelectOptions()"
        inputId="vehiculeId"
        placeholder="Choisir un véhicule…"
      />
    </app-form-field>

    <app-form-field
      [error]="
        showFieldError(createForm.type())
          ? firstFieldError(createForm.type().errors())
          : null
      "
      inputId="type"
      label="Type"
    >
      <app-field-select
        [formField]="createForm.type"
        [invalid]="showFieldError(createForm.type())"
        [options]="typeSelectOptions"
        inputId="type"
      />
    </app-form-field>

    <div class="form-page__coords">
      <app-form-field
        [error]="
          showFieldError(createForm.datePlanifiee())
            ? firstFieldError(createForm.datePlanifiee().errors())
            : null
        "
        inputId="datePlanifiee"
        label="Date planifiée"
      >
        <app-iso-datetime-input
          [ariaInvalid]="showFieldError(createForm.datePlanifiee())"
          [formField]="createForm.datePlanifiee"
          inputId="datePlanifiee"
          timeAriaLabel="Heure planifiée"
        />
      </app-form-field>
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-medium text-muted" for="montant">
          Coût estimé (EUR)
        </label>
        <input
          [formField]="createForm.montant"
          [class]="fieldClasses(createForm.montant())"
          id="montant"
          step="0.01"
          type="number"
        />
        @if (showFieldError(createForm.montant())) {
        <p class="text-xs text-brake" role="alert">
          {{ firstFieldError(createForm.montant().errors()) }}
        </p>
        }
      </div>
    </div>
  </app-form-section>

  @if (formError()) {
  <div class="alert-panel" role="alert">{{ formError() }}</div>
  }

  <app-form-actions>
    <button class="btn-primary pressable min-h-11 px-5" type="submit">
      Enregistrer
    </button>
    <a class="btn-outline pressable min-h-11 px-5" routerLink="/maintenance">
      Annuler
    </a>
  </app-form-actions>
</form>
}
