<nav
  aria-label="Sections maintenance"
  class="flex flex-wrap gap-2 border-b border-line pb-3"
>
  @for (section of sections; track section.lien) {
  <a
    [routerLink]="section.lien"
    [routerLinkActiveOptions]="{ exact: section.exact }"
    ariaCurrentWhenActive="page"
    class="pressable min-h-10 rounded-lg border border-line/80 px-3 py-2 text-sm font-medium text-ink aria-[current=page]:border-pine aria-[current=page]:bg-pine/5 aria-[current=page]:text-pine"
    routerLinkActive
  >
    {{ section.label }}
  </a>
  }
</nav>
